name: Deploy production and dev to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          persist-credentials: false
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: preview
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p _site/dev
          cp production/index.html _site/index.html
          cp preview/index.html _site/dev/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
