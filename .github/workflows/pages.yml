name: Deploy production and dev to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: production
          persist-credentials: false
      - name: Check dev branch
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api --include "repos/$GITHUB_REPOSITORY/branches/dev" 2>/dev/null | head -n1)
          case "$status" in
            *" 200 "*) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            *" 404 "*) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unable to check the dev branch ($status)" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v6
        if: steps.preview.outputs.exists == 'true'
        with:
          ref: dev
          path: preview
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p _site
          for asset in index.html bank-data.js question-bank-notice.txt; do
            if [ -f "production/$asset" ]; then cp "production/$asset" _site/; fi
          done
          if [ -d preview ]; then
            mkdir -p _site/dev
            for asset in index.html bank-data.js question-bank-notice.txt; do
              if [ -f "preview/$asset" ]; then cp "preview/$asset" _site/dev/; fi
            done
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment
